<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taquik - Tu página de tickets favorita</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
  <body>
    <header class="main-header">
        <!-- Logo -->
        <a href="#" class="logo-container">
            <img src="imagenes/Logo.png" alt="Taquik Logo" id="logo">
        </a>

        <!-- Menú de navegación -->
        <nav class="nav-menu">
            <a href="#peliculas" class="nav-link">Películas</a>
            <a href="#salas" class="nav-link">Salas</a>
            <a href="#informacion" class="nav-link">Información</a>
        </nav>

        <!-- Zona de acciones/usuario -->
        <span class="user-actions">
            <button class="btn-login">Entrar</button>
        </span>
    </header>

    <!-- Zona de peliculas -->
    <section id="peliculas">
        <h1 id="p-titulo">PELICULAS DISPONIBLES</h1>
        <span>
            <div class="cartel">
              <img src="imagenes/Carteleras/cars.jpg" alt="cars portada">
              <p class="p-c-nombre">Cars 20</p>
            </div>
        </span>
    </section>

    <!--Zona de Salas-->
    <section id="salas">
      <h1 id="s-titulo">TIPOS DE SALAS</h1>
    </section>

    <!--Zona de información-->
    <section id="informacion">
      <h1 id="i-titulo">INFORMACIÓN</h1>
    </section>

<footer class="footer-bottom">
   <p>© 2026 Taquik Todos los derechos reservados.</p> 
</footer>
</body>
</html>
